name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - name: Check release tag
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${version}`) { throw new Error("Release tag must match package.json version"); }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack --pack-destination artifacts
      - name: Publish package
        run: pnpm publish ./artifacts/*.tgz --no-git-checks --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
